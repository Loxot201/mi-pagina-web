<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Mi primera página</title>

  <link rel="stylesheet" href="styles.css">
</head>

<body>

  <header>
    <h1>Mi primera página web</h1>

    <nav>
      <a href="#inicio">Inicio</a>
      <a href="#servicios">Servicios</a>
      <a href="#contacto">Contacto</a>
    </nav>
  </header>


  <main>

    <section id="inicio">
      <h2>Bienvenido</h2>

      <p>
        Esta es mi primera página web creada desde cero.
      </p>

      <button id="boton">
        Haz clic aquí
      </button>
    </section>


    <section id="servicios">
      <h2>Servicios</h2>

      <p>
        Aquí puedes explicar lo que haces.
      </p>
    </section>


    <section>
      <h2>Mi imagen</h2>

      <img
        src="images/foto.jpg"
        alt="Descripción de la imagen"
      >
    </section>


    <section id="contacto">

      <h2>Contacto</h2>

      <form id="contactForm">

        <label for="nombre">
          Nombre
        </label>

        <input
          type="text"
          id="nombre"
          placeholder="Escribe tu nombre"
          required
        >


        <label for="email">
          Correo
        </label>

        <input
          type="email"
          id="email"
          placeholder="correo@ejemplo.com"
          required
        >


        <div class="form-buttons">

          <button
            type="submit"
            id="submitButton"
          >
            Guardar
          </button>

          <button
            type="button"
            id="cancelButton"
            hidden
          >
            Cancelar edición
          </button>

        </div>

      </form>

      <p id="respuesta"></p>


      <hr>


      <h2>Contactos registrados</h2>

      <input
        type="search"
        id="buscar"
        placeholder="Buscar contacto..."
      >

      <div id="listaContactos"></div>

    </section>

  </main>


  <footer>
    <p>
      © 2026 Mi página
    </p>
  </footer>


  <script src="script.js"></script>

</body>

</html>
